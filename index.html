<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Коммутатор 48 портов</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      background: #0f172a; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
      touch-action: none;
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 10;
      line-height: 1.4;
    }
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #modal.show { display: flex; }
    .modal-content {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-content h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #38bdf8;
    }
    .modal-content input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      margin-bottom: 16px;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    .buttons button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-save { background: #22c55e; color: white; }
    .btn-close { background: #475569; color: white; }
    #port-label {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 15px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
  </style>
</head>
<body>

  <div id="info">
    Крутите модель пальцем.<br>
    Нажимайте на порты, чтобы задать название.
  </div>

  <div id="port-label"></div>

  <div id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Порт 1</h2>
      <input type="text" id="port-name" placeholder="Например: Сервер 1 или Камера" maxlength="40">
      <div class="buttons">
        <button class="btn-save" onclick="saveName()">Сохранить</button>
        <button class="btn-close" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // ========== НАСТРОЙКИ ==========
    let scene, camera, renderer, controls;
    let ports = [];
    let currentPort = null;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();

    // Загружаем сохранённые названия
    let portNames = JSON.parse(localStorage.getItem('switch48_names') || '{}');

    init();
    animate();

    function init() {
      // Сцена
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      // Камера
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 25, 55);

      // Рендерер
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Управление (крутить пальцем)
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 30;
      controls.maxDistance = 90;
      controls.maxPolarAngle = Math.PI / 1.8;

      // Свет
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);

      const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
      light1.position.set(30, 50, 40);
      scene.add(light1);

      const light2 = new THREE.DirectionalLight(0x38bdf8, 0.3);
      light2.position.set(-20, 20, -30);
      scene.add(light2);

      // ========== КОРПУС КОММУТАТОРА ==========
      const bodyGeo = new THREE.BoxGeometry(48, 6, 18);
      const bodyMat = new THREE.MeshStandardMaterial({ 
        color: 0x1e293b,
        metalness: 0.3,
        roughness: 0.7
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 3;
      scene.add(body);

      // Передняя панель (чуть темнее)
      const frontGeo = new THREE.BoxGeometry(48.2, 6.2, 0.4);
      const frontMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
      const front = new THREE.Mesh(frontGeo, frontMat);
      front.position.set(0, 3, 9.1);
      scene.add(front);

      // ========== 48 ПОРТОВ ==========
      const portWidth = 1.6;
      const portHeight = 1.5;
      const portDepth = 1.2;
      const startX = -22.5;
      const gap = 1.85;

      for (let i = 0; i < 48; i++) {
        const row = Math.floor(i / 24);      // 0 или 1
        const col = i % 24;

        const geo = new THREE.BoxGeometry(portWidth, portHeight, portDepth);
        const mat = new THREE.MeshStandardMaterial({ 
          color: 0x334155,
          metalness: 0.2,
          roughness: 0.6
        });
        const port = new THREE.Mesh(geo, mat);

        port.position.x = startX + col * gap;
        port.position.y = row === 0 ? 4.6 : 2.4;
        port.position.z = 9.5;

        port.userData = { 
          id: i + 1,
          originalColor: 0x334155
        };

        scene.add(port);
        ports.push(port);
      }

      // Подпись "48-PORT SWITCH"
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 32px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('48-PORT GIGABIT SWITCH', 256, 42);

      const texture = new THREE.CanvasTexture(canvas);
      const labelMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      const label = new THREE.Mesh(new THREE.PlaneGeometry(30, 3.5), labelMat);
      label.position.set(0, 7.5, 0);
      label.rotation.x = -Math.PI / 2;
      scene.add(label);

      // События
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      renderer.domElement.addEventListener('pointermove', onPointerMove);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onPointerMove(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(ports);

      // Подсветка
      ports.forEach(p => p.material.color.setHex(p.userData.originalColor));
      
      const label = document.getElementById('port-label');
      if (intersects.length > 0) {
        const port = intersects[0].object;
        port.material.color.setHex(0x38bdf8);
        
        const name = portNames[port.userData.id] || 'без названия';
        label.textContent = `Порт ${port.userData.id}: ${name}`;
        label.style.opacity = '1';
      } else {
        label.style.opacity = '0';
      }
    }

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(ports);

      if (intersects.length > 0) {
        currentPort = intersects[0].object;
        openModal(currentPort.userData.id);
      }
    }

    function openModal(id) {
      document.getElementById('modal-title').textContent = `Порт ${id}`;
      document.getElementById('port-name').value = portNames[id] || '';
      document.getElementById('modal').classList.add('show');
      setTimeout(() => document.getElementById('port-name').focus(), 100);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      currentPort = null;
    }

    function saveName() {
      if (!currentPort) return;
      const id = currentPort.userData.id;
      const name = document.getElementById('port-name').value.trim();
      
      if (name) {
        portNames[id] = name;
      } else {
        delete portNames[id];
      }
      
      localStorage.setItem('switch48_names', JSON.stringify(portNames));
      closeModal();
    }

    // Закрытие модалки по клику вне её
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
