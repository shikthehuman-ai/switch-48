<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Коммутатор 48 портов</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.9);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 10;
      line-height: 1.4;
      max-width: 280px;
    }

    #reset-btn {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: #334155;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }
    #reset-btn:active { background: #475569; }

    #side-panel {
      width: 300px;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    #side-panel h2 {
      padding: 14px 16px;
      font-size: 15px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      color: #38bdf8;
    }

    #ports-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .port-row {
      display: flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      margin-bottom: 3px;
      transition: background 0.15s;
      gap: 8px;
    }
    .port-row:hover { background: #334155; }
    .port-row.active { background: #0ea5e9; color: white; }

    .port-num {
      font-weight: 700;
      min-width: 26px;
      font-size: 13px;
      color: #94a3b8;
    }
    .port-row.active .port-num { color: white; }

    .port-name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .port-name.empty { color: #64748b; font-style: italic; }

    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #modal.show { display: flex; }

    .modal-content {
      background: #1e293b;
      padding: 22px;
      border-radius: 14px;
      width: 100%;
      max-width: 340px;
    }
    .modal-content h2 {
      font-size: 18px;
      margin-bottom: 14px;
      color: #38bdf8;
    }
    .modal-content input {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      border: none;
      border-radius: 9px;
      background: #0f172a;
      color: white;
      margin-bottom: 14px;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    .buttons button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-save { background: #22c55e; color: white; }
    .btn-close { background: #475569; color: white; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #side-panel {
        width: 100%;
        height: 36vh;
        border-left: none;
        border-top: 1px solid #334155;
      }
      #info { font-size: 12px; max-width: 200px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <div id="info">
      Крутите пальцем • Щипок — зум<br>
      Клик по порту на коммутаторе — редактировать<br>
      Клик по строке справа — только подсветка
    </div>
    <button id="reset-btn" onclick="resetCamera()">Сбросить вид</button>
  </div>

  <div id="side-panel">
    <h2>Порты и названия</h2>
    <div id="ports-list"></div>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Порт 1</h2>
      <input type="text" id="port-name" placeholder="Например: Сервер 1 / Камера" maxlength="50">
      <div class="buttons">
        <button class="btn-save" onclick="saveName()">Сохранить</button>
        <button class="btn-close" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let ports = [];
    let currentPortId = null;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let portNames = JSON.parse(localStorage.getItem('switch48_names') || '{}');

    init();
    buildPortsList();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(38, container.clientWidth / container.clientHeight, 0.1, 500);
      camera.position.set(0, 22, 58);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.minDistance = 30;
      controls.maxDistance = 120;
      controls.maxPolarAngle = Math.PI * 0.82;
      controls.target.set(0, 3.5, 0);

      // Свет
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dir1 = new THREE.DirectionalLight(0xffffff, 0.95);
      dir1.position.set(30, 50, 40);
      scene.add(dir1);
      const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dir2.position.set(-40, 30, -20);
      scene.add(dir2);
      const dir3 = new THREE.DirectionalLight(0xf97316, 0.15);
      dir3.position.set(0, 10, 30);
      scene.add(dir3);

      createSwitch();

      window.addEventListener('resize', onResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);
    }

    function createSwitch() {
      // ===== ОСНОВНОЙ КОРПУС (белый как Aruba) =====
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(48, 4.8, 20),
        new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.1, roughness: 0.45 })
      );
      body.position.y = 2.4;
      scene.add(body);

      // Передняя панель
      const front = new THREE.Mesh(
        new THREE.BoxGeometry(48.15, 4.9, 0.4),
        new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.05, roughness: 0.5 })
      );
      front.position.set(0, 2.4, 10.15);
      scene.add(front);

      // Оранжевая верхняя полоска
      const topStripe = new THREE.Mesh(
        new THREE.BoxGeometry(48.3, 0.28, 20.3),
        new THREE.MeshStandardMaterial({ color: 0xf97316 })
      );
      topStripe.position.y = 4.9;
      scene.add(topStripe);

      // Логотип aruba
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f97316';
      ctx.font = 'bold 32px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('aruba  instant on', 256, 42);
      const tex = new THREE.CanvasTexture(canvas);
      const logo = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 2),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true })
      );
      logo.position.set(0, 5.05, 0);
      logo.rotation.x = -Math.PI / 2;
      scene.add(logo);

      // ===== ПОРТЫ (более реалистичные) =====
      // Группы: 4 группы по 12 портов (как часто бывает)
      const groups = [
        { start: 0,  count: 12 },
        { start: 12, count: 12 },
        { start: 24, count: 12 },
        { start: 36, count: 12 }
      ];

      let portIndex = 0;
      const portWidth = 1.35;
      const portHeight = 1.15;
      const portDepth = 1.6;
      const groupGap = 1.1; // промежуток между группами
      let currentX = -22.8;

      groups.forEach((group, g) => {
        for (let i = 0; i < group.count; i++) {
          const row = Math.floor(portIndex / 24); // 0 или 1
          const colInRow = portIndex % 24;

          // Корпус порта (тёмный)
          const portBody = new THREE.Mesh(
            new THREE.BoxGeometry(portWidth, portHeight, portDepth),
            new THREE.MeshStandardMaterial({
              color: 0x1e293b,
              metalness: 0.35,
              roughness: 0.4
            })
          );

          // Лицевая часть порта (чуть светлее + углубление)
          const face = new THREE.Mesh(
            new THREE.BoxGeometry(portWidth - 0.15, portHeight - 0.2, 0.15),
            new THREE.MeshStandardMaterial({ color: 0x0f172a })
          );
          face.position.z = portDepth / 2 + 0.02;

          const portGroup = new THREE.Group();
          portGroup.add(portBody);
          portGroup.add(face);

          // Позиция
          const x = currentX + i * (portWidth + 0.22);
          const y = row === 0 ? 3.55 : 2.15;
          portGroup.position.set(x, y, 10.7);

          portGroup.userData = {
            id: portIndex + 1,
            originalColor: 0x1e293b,
            meshes: [portBody, face]
          };

          scene.add(portGroup);
          ports.push(portGroup);

          // Маленький светодиод над портом
          const led = new THREE.Mesh(
            new THREE.BoxGeometry(0.25, 0.18, 0.1),
            new THREE.MeshStandardMaterial({
              color: 0x22c55e,
              emissive: 0x166534,
              emissiveIntensity: 0.4
            })
          );
          led.position.set(x, y + 0.75, 10.85);
          scene.add(led);

          portIndex++;
        }
        currentX += group.count * (portWidth + 0.22) + groupGap;
      });

      // Боковые "уши" (вентиляция)
      const ventMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
      [-1, 1].forEach(side => {
        const vent = new THREE.Mesh(
          new THREE.BoxGeometry(0.7, 4.2, 17),
          ventMat
        );
        vent.position.set(side * 24.5, 2.4, 0);
        scene.add(vent);
      });
    }

    function buildPortsList() {
      const list = document.getElementById('ports-list');
      list.innerHTML = '';

      for (let i = 1; i <= 48; i++) {
        const row = document.createElement('div');
        row.className = 'port-row';
        row.dataset.id = i;

        const name = portNames[i] || '';
        row.innerHTML = `
          <span class="port-num">${i}</span>
          <span class="port-name ${name ? '' : 'empty'}">${name || 'без названия'}</span>
        `;

        // Только подсветка, без редактирования
        row.addEventListener('click', () => {
          highlightPort(i);
        });

        list.appendChild(row);
      }
    }

    function highlightPort(id) {
      // Сброс
      ports.forEach(p => {
        p.userData.meshes.forEach(m => {
          if (m.material.color) m.material.color.setHex(p.userData.originalColor);
        });
        p.scale.set(1, 1, 1);
      });
      document.querySelectorAll('.port-row').forEach(r => r.classList.remove('active'));

      // Подсветка
      const port = ports.find(p => p.userData.id === id);
      if (port) {
        port.userData.meshes.forEach(m => {
          if (m.material.color) m.material.color.setHex(0x0ea5e9);
        });
        port.scale.set(1.12, 1.12, 1.25);
      }

      const row = document.querySelector(`.port-row[data-id="${id}"]`);
      if (row) {
        row.classList.add('active');
        row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // Ищем пересечения с портами (они теперь Group)
      const intersects = raycaster.intersectObjects(ports, true);

      if (intersects.length > 0) {
        // Находим родительскую группу порта
        let obj = intersects[0].object;
        while (obj && !obj.userData.id) {
          obj = obj.parent;
        }
        if (obj && obj.userData.id) {
          const id = obj.userData.id;
          highlightPort(id);
          openModal(id); // редактирование только при клике на 3D-порт
        }
      }
    }

    function openModal(id) {
      currentPortId = id;
      document.getElementById('modal-title').textContent = `Порт ${id}`;
      document.getElementById('port-name').value = portNames[id] || '';
      document.getElementById('modal').classList.add('show');
      setTimeout(() => document.getElementById('port-name').focus(), 80);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      currentPortId = null;
    }

    function saveName() {
      if (currentPortId === null) return;
      const name = document.getElementById('port-name').value.trim();

      if (name) {
        portNames[currentPortId] = name;
      } else {
        delete portNames[currentPortId];
      }

      localStorage.setItem('switch48_names', JSON.stringify(portNames));
      buildPortsList();
      highlightPort(currentPortId);
      closeModal();
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    function resetCamera() {
      camera.position.set(0, 22, 58);
      controls.target.set(0, 3.5, 0);
      controls.update();
    }

    function onResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
