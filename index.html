<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Коммутатор 48 портов</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.9);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 10;
      line-height: 1.4;
      max-width: 260px;
    }

    #reset-btn {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: #334155;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }
    #reset-btn:active { background: #475569; }

    #side-panel {
      width: 320px;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    #side-panel h2 {
      padding: 16px;
      font-size: 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      color: #38bdf8;
    }

    #ports-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .port-row {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
      gap: 10px;
    }
    .port-row:hover { background: #334155; }
    .port-row.active { background: #0ea5e9; color: white; }

    .port-num {
      font-weight: 700;
      min-width: 28px;
      color: #94a3b8;
    }
    .port-row.active .port-num { color: white; }

    .port-name {
      flex: 1;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .port-name.empty { color: #64748b; font-style: italic; }

    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #modal.show { display: flex; }

    .modal-content {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 340px;
    }
    .modal-content h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #38bdf8;
    }
    .modal-content input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      margin-bottom: 16px;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    .buttons button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-save { background: #22c55e; color: white; }
    .btn-close { background: #475569; color: white; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #side-panel {
        width: 100%;
        height: 38vh;
        border-left: none;
        border-top: 1px solid #334155;
      }
      #info { font-size: 12px; max-width: 200px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <div id="info">
      Крутите пальцем • Щипок — приблизить/отдалить<br>
      Нажимайте на порты или строки справа
    </div>
    <button id="reset-btn" onclick="resetCamera()">Сбросить вид</button>
  </div>

  <div id="side-panel">
    <h2>Порты и названия</h2>
    <div id="ports-list"></div>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Порт 1</h2>
      <input type="text" id="port-name" placeholder="Например: Сервер 1 / Камера холл" maxlength="50">
      <div class="buttons">
        <button class="btn-save" onclick="saveName()">Сохранить</button>
        <button class="btn-close" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let ports = [];
    let currentPortId = null;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let portNames = JSON.parse(localStorage.getItem('switch48_names') || '{}');

    init();
    buildPortsList();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 500);
      camera.position.set(0, 28, 70);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 35;
      controls.maxDistance = 140;
      controls.maxPolarAngle = Math.PI * 0.85;
      controls.target.set(0, 4, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const dir1 = new THREE.DirectionalLight(0xffffff, 0.9);
      dir1.position.set(40, 60, 50);
      scene.add(dir1);
      const dir2 = new THREE.DirectionalLight(0xffffff, 0.35);
      dir2.position.set(-30, 20, -40);
      scene.add(dir2);

      createSwitch();

      window.addEventListener('resize', onResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);
    }

    function createSwitch() {
      const bodyGeo = new THREE.BoxGeometry(52, 5.5, 22);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0xf1f5f9,
        metalness: 0.15,
        roughness: 0.55
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 2.75;
      scene.add(body);

      const frontGeo = new THREE.BoxGeometry(52.1, 5.6, 0.35);
      const frontMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
      const front = new THREE.Mesh(frontGeo, frontMat);
      front.position.set(0, 2.75, 11.1);
      scene.add(front);

      const orangeGeo = new THREE.BoxGeometry(52.2, 0.35, 22.2);
      const orangeMat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
      const orange = new THREE.Mesh(orangeGeo, orangeMat);
      orange.position.y = 5.55;
      scene.add(orange);

      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f97316';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('aruba instant on', 256, 44);
      const tex = new THREE.CanvasTexture(canvas);
      const logo = new THREE.Mesh(
        new THREE.PlaneGeometry(18, 2.2),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true })
      );
      logo.position.set(0, 5.7, 0);
      logo.rotation.x = -Math.PI / 2;
      scene.add(logo);

      const portW = 1.55;
      const portH = 1.35;
      const portD = 1.4;
      const startX = -23.2;
      const gap = 1.92;

      for (let i = 0; i < 48; i++) {
        const row = Math.floor(i / 24);
        const col = i % 24;

        const geo = new THREE.BoxGeometry(portW, portH, portD);
        const mat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          metalness: 0.3,
          roughness: 0.5
        });
        const port = new THREE.Mesh(geo, mat);

        port.position.x = startX + col * gap;
        port.position.y = row === 0 ? 4.15 : 2.35;
        port.position.z = 11.7;

        port.userData = {
          id: i + 1,
          originalColor: 0x1e293b
        };

        scene.add(port);
        ports.push(port);
      }

      const ventMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1 });
      for (let side of [-1, 1]) {
        const vent = new THREE.Mesh(
          new THREE.BoxGeometry(0.6, 4.5, 18),
          ventMat
        );
        vent.position.set(side * 26.3, 2.75, 0);
        scene.add(vent);
      }
    }

    function buildPortsList() {
      const list = document.getElementById('ports-list');
      list.innerHTML = '';

      for (let i = 1; i <= 48; i++) {
        const row = document.createElement('div');
        row.className = 'port-row';
        row.dataset.id = i;

        const name = portNames[i] || '';
        row.innerHTML = `
          <span class="port-num">${i}</span>
          <span class="port-name ${name ? '' : 'empty'}">${name || 'без названия'}</span>
        `;

        row.addEventListener('click', () => {
          highlightPort(i);
          openModal(i);
        });

        list.appendChild(row);
      }
    }

    function highlightPort(id) {
      ports.forEach(p => {
        p.material.color.setHex(p.userData.originalColor);
        p.scale.set(1, 1, 1);
      });
      document.querySelectorAll('.port-row').forEach(r => r.classList.remove('active'));

      const port = ports.find(p => p.userData.id === id);
      if (port) {
        port.material.color.setHex(0x0ea5e9);
        port.scale.set(1.15, 1.15, 1.3);
      }
      const row = document.querySelector(`.port-row[data-id="${id}"]`);
      if (row) {
        row.classList.add('active');
        row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(ports);

      if (intersects.length > 0) {
        const id = intersects[0].object.userData.id;
        highlightPort(id);
        openModal(id);
      }
    }

    function openModal(id) {
      currentPortId = id;
      document.getElementById('modal-title').textContent = `Порт ${id}`;
      document.getElementById('port-name').value = portNames[id] || '';
      document.getElementById('modal').classList.add('show');
      setTimeout(() => document.getElementById('port-name').focus(), 80);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      currentPortId = null;
    }

    function saveName() {
      if (currentPortId === null) return;
      const name = document.getElementById('port-name').value.trim();

      if (name) {
        portNames[currentPortId] = name;
      } else {
        delete portNames[currentPortId];
      }

      localStorage.setItem('switch48_names', JSON.stringify(portNames));
      buildPortsList();
      highlightPort(currentPortId);
      closeModal();
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    function resetCamera() {
      camera.position.set(0, 28, 70);
      controls.target.set(0, 4, 0);
      controls.update();
    }

    function onResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
