<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Коммутатор 48 портов</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.92);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 10;
      line-height: 1.4;
      max-width: 280px;
    }
    #reset-btn {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: #334155;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }
    #reset-btn:active { background: #475569; }
    #side-panel {
      width: 300px;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }
    #side-panel h2 {
      padding: 14px 16px;
      font-size: 15px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      color: #38bdf8;
    }
    #ports-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .port-row {
      display: flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      margin-bottom: 3px;
      transition: background 0.15s;
      gap: 8px;
    }
    .port-row:hover { background: #334155; }
    .port-row.active { background: #0ea5e9; color: white; }
    .port-num {
      font-weight: 700;
      min-width: 26px;
      font-size: 13px;
      color: #94a3b8;
    }
    .port-row.active .port-num { color: white; }
    .port-name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .port-name.empty { color: #64748b; font-style: italic; }
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #modal.show { display: flex; }
    .modal-content {
      background: #1e293b;
      padding: 22px;
      border-radius: 14px;
      width: 100%;
      max-width: 340px;
    }
    .modal-content h2 {
      font-size: 18px;
      margin-bottom: 14px;
      color: #38bdf8;
    }
    .modal-content input {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      border: none;
      border-radius: 9px;
      background: #0f172a;
      color: white;
      margin-bottom: 14px;
    }
    .buttons { display: flex; gap: 10px; }
    .buttons button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-save { background: #22c55e; color: white; }
    .btn-close { background: #475569; color: white; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #side-panel {
        width: 100%;
        height: 36vh;
        border-left: none;
        border-top: 1px solid #334155;
      }
      #info { font-size: 12px; max-width: 200px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="info">
      Крутите пальцем • Щипок — зум<br>
      Клик по порту на коммутаторе — редактировать<br>
      Клик по строке справа — только подсветка
    </div>
    <button id="reset-btn" onclick="resetCamera()">Сбросить вид</button>
  </div>

  <div id="side-panel">
    <h2>Порты и названия</h2>
    <div id="ports-list"></div>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Порт 1</h2>
      <input type="text" id="port-name" placeholder="Например: Сервер 1 / Камера" maxlength="50">
      <div class="buttons">
        <button class="btn-save" onclick="saveName()">Сохранить</button>
        <button class="btn-close" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let ports = [];
    let currentPortId = null;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let portNames = JSON.parse(localStorage.getItem('switch48_names') || '{}');

    init();
    buildPortsList();
    animate();

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(36, container.clientWidth / container.clientHeight, 0.1, 500);
      camera.position.set(0, 16, 48);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.minDistance = 26;
      controls.maxDistance = 100;
      controls.maxPolarAngle = Math.PI * 0.8;
      controls.target.set(0, 2.8, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dir1 = new THREE.DirectionalLight(0xffffff, 0.85);
      dir1.position.set(20, 35, 30);
      scene.add(dir1);
      const dir2 = new THREE.DirectionalLight(0xffffff, 0.3);
      dir2.position.set(-25, 15, -20);
      scene.add(dir2);

      createSwitch();

      window.addEventListener('resize', onResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);
    }

    function addEdges(mesh, color = 0x475569) {
      const edges = new THREE.EdgesGeometry(mesh.geometry);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color }));
      line.position.copy(mesh.position);
      line.rotation.copy(mesh.rotation);
      line.scale.copy(mesh.scale);
      scene.add(line);
    }

    function createSwitch() {
      // Корпус
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        metalness: 0.06,
        roughness: 0.5
      });

      const body = new THREE.Mesh(new THREE.BoxGeometry(44, 4.4, 17.5), bodyMat);
      body.position.y = 2.2;
      scene.add(body);
      addEdges(body);

      const front = new THREE.Mesh(
        new THREE.BoxGeometry(44.15, 4.5, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xdbe4f0 })
      );
      front.position.set(0, 2.2, 8.85);
      scene.add(front);
      addEdges(front);

      const top = new THREE.Mesh(
        new THREE.BoxGeometry(44.2, 0.22, 17.7),
        new THREE.MeshStandardMaterial({ color: 0xe2e8f0 })
      );
      top.position.y = 4.45;
      scene.add(top);
      addEdges(top);

      // Логотип
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ea580c';
      ctx.font = 'bold 28px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('aruba  instant on', 256, 40);
      const tex = new THREE.CanvasTexture(canvas);
      const logo = new THREE.Mesh(
        new THREE.PlaneGeometry(13, 1.6),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true })
      );
      logo.position.set(0, 4.6, 0);
      logo.rotation.x = -Math.PI / 2;
      scene.add(logo);

      // ===== ПОРТЫ =====
      const portW = 1.20;
      const portH = 1.0;
      const portD = 1.5;
      const gap = 0.15;
      const groupGap = 0.72;

      const groupWidth = 6 * portW + 5 * gap;
      const totalWidth = 4 * groupWidth + 3 * groupGap;

      const startX = -18.1;

      const xPositions = [];
      for (let col = 0; col < 24; col++) {
        const groupIndex = Math.floor(col / 6);
        const posInGroup = col % 6;
        const x = startX + groupIndex * (groupWidth + groupGap) + posInGroup * (portW + gap);
        xPositions.push(x);
      }

      for (let i = 0; i < 48; i++) {
        const row = Math.floor(i / 24);
        const col = i % 24;
        const x = xPositions[col];

        // Нижний ряд поднят на толщину лампочки (~0.12)
        const y = row === 0 ? 3.25 : 1.57;

        const pBody = new THREE.Mesh(
          new THREE.BoxGeometry(portW, portH, portD),
          new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            metalness: 0.28,
            roughness: 0.45
          })
        );

        const face = new THREE.Mesh(
          new THREE.BoxGeometry(portW - 0.16, portH - 0.2, 0.1),
          new THREE.MeshStandardMaterial({ color: 0x0f172a })
        );
        face.position.z = portD / 2 + 0.02;

        const hole = new THREE.Mesh(
          new THREE.BoxGeometry(portW - 0.38, portH - 0.38, 0.08),
          new THREE.MeshStandardMaterial({ color: 0x020617 })
        );
        hole.position.z = portD / 2 + 0.06;

        const port = new THREE.Group();
        port.add(pBody);
        port.add(face);
        port.add(hole);
        port.position.set(x, y, 9.35);

        port.userData = {
          id: i + 1,
          originalColor: 0x1e293b,
          meshes: [pBody, face]
        };

        scene.add(port);
        ports.push(port);

        // Светодиод
        const led = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, 0.12, 0.07),
          new THREE.MeshStandardMaterial({
            color: 0x22c55e,
            emissive: 0x166534,
            emissiveIntensity: 0.55
          })
        );
        led.position.set(x, y + 0.62, 9.5);
        scene.add(led);
      }

      // Номера
      function makeNum(text, px, py) {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 32;
        const ct = c.getContext('2d');
        ct.fillStyle = '#475569';
        ct.font = 'bold 16px Arial';
        ct.textAlign = 'center';
        ct.textBaseline = 'middle';
        ct.fillText(text, 32, 16);
        const t = new THREE.CanvasTexture(c);
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(0.7, 0.35),
          new THREE.MeshBasicMaterial({ map: t, transparent: true })
        );
        m.position.set(px, py, 9.2);
        scene.add(m);
      }

      for (let i = 0; i < 48; i++) {
        const row = Math.floor(i / 24);
        const col = i % 24;
        const x = xPositions[col];
        if (row === 0) makeNum(String(i + 1), x, 4.0);
        else makeNum(String(i + 1), x, 0.87);
      }

      // SFP
      const sfpX = 18.8;
      for (let i = 0; i < 4; i++) {
        const row = i < 2 ? 0 : 1;
        const col = i % 2;
        const sfp = new THREE.Mesh(
          new THREE.BoxGeometry(1.35, 1.15, 1.9),
          new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.35, roughness: 0.4 })
        );
        sfp.position.set(sfpX + col * 1.55, row === 0 ? 3.3 : 1.62, 9.2);
        scene.add(sfp);
        addEdges(sfp, 0x334155);
      }

      // Боковые
      const ventMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1 });
      [-1, 1].forEach(side => {
        const vent = new THREE.Mesh(new THREE.BoxGeometry(0.55, 3.9, 15.5), ventMat);
        vent.position.set(side * 22.4, 2.2, 0);
        scene.add(vent);
        addEdges(vent, 0x64748b);
      });
    }

    function buildPortsList() {
      const list = document.getElementById('ports-list');
      list.innerHTML = '';
      for (let i = 1; i <= 48; i++) {
        const row = document.createElement('div');
        row.className = 'port-row';
        row.dataset.id = i;
        const name = portNames[i] || '';
        row.innerHTML = `
          <span class="port-num">${i}</span>
          <span class="port-name ${name ? '' : 'empty'}">${name || 'без названия'}</span>
        `;
        row.addEventListener('click', () => highlightPort(i));
        list.appendChild(row);
      }
    }

    function highlightPort(id) {
      ports.forEach(p => {
        p.userData.meshes.forEach(m => m.material.color.setHex(p.userData.originalColor));
        p.scale.set(1, 1, 1);
      });
      document.querySelectorAll('.port-row').forEach(r => r.classList.remove('active'));

      const port = ports.find(p => p.userData.id === id);
      if (port) {
        port.userData.meshes.forEach(m => m.material.color.setHex(0x0ea5e9));
        port.scale.set(1.12, 1.12, 1.2);
      }
      const row = document.querySelector(`.port-row[data-id="${id}"]`);
      if (row) {
        row.classList.add('active');
        row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(ports, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.id) obj = obj.parent;
        if (obj && obj.userData.id) {
          highlightPort(obj.userData.id);
          openModal(obj.userData.id);
        }
      }
    }

    function openModal(id) {
      currentPortId = id;
      document.getElementById('modal-title').textContent = `Порт ${id}`;
      document.getElementById('port-name').value = portNames[id] || '';
      document.getElementById('modal').classList.add('show');
      setTimeout(() => document.getElementById('port-name').focus(), 80);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      currentPortId = null;
    }

    function saveName() {
      if (currentPortId === null) return;
      const name = document.getElementById('port-name').value.trim();
      if (name) portNames[currentPortId] = name;
      else delete portNames[currentPortId];
      localStorage.setItem('switch48_names', JSON.stringify(portNames));
      buildPortsList();
      highlightPort(currentPortId);
      closeModal();
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    function resetCamera() {
      camera.position.set(0, 16, 48);
      controls.target.set(0, 2.8, 0);
      controls.update();
    }

    function onResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
